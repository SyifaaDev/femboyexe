name: Build EXE
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-i686
      - name: Compile
        run: |
          i686-w64-mingw32-g++ femboy.cpp -o femboy.exe -O2 -std=c++17 \
            -static -static-libgcc -static-libstdc++ \
            -D_WIN32_WINNT=0x0601 -s
      - uses: actions/upload-artifact@v4
        with:
          name: femboy-exe
          path: femboy.exe
